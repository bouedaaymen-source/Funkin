name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'FunkinMods-MarioMadness-V2.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          # Ensure compatibility if minorApiLevel 36.1 is not cached on runner
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Keystore & Build APK
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          gradle assembleDebug --no-daemon --stacktrace
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "Found built APK at: $APK_PATH"
          cp "$APK_PATH" FunkinMods-MarioMadness-V2.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FunkinMods-MarioMadness-V2-APK
          path: FunkinMods-MarioMadness-V2.apk

      - name: Commit APK Directly to Repository Root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- app/build.gradle.kts || true
          git add -f FunkinMods-MarioMadness-V2.apk
          git diff --staged --quiet || (git commit -m "chore: attach compiled FunkinMods-MarioMadness-V2.apk [skip ci]" && git push)

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-mmv2
          name: "🍄 FunkinMods — Mario's Madness V2 Edition (Android APK)"
          body: |
            ### ⬇️ Direct Android APK Download
            Tap **`FunkinMods-MarioMadness-V2.apk`** below under **Assets** to download and install the app on your Android phone (works in Algeria and worldwide).
          files: |
            FunkinMods-MarioMadness-V2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
