name: Build & Publish Psych 0.7.3 Mod (.ZIP) & Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'FunkinMods-MarioMadness-V2.apk'
      - 'Secret-Exit-Reimagined-Psych-0.7.3.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-mod-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synthesize Playable Ogg Vorbis Audio & Package Secret Exit Reimagined (Psych 0.7.3 .ZIP)
        run: |
          python3 - << 'EOF'
          import math, os, struct, subprocess, wave, zipfile

          songs = [
              ("secret-exit-reimagined", 200),
              ("starman-redemption", 185),
              ("unbeatable-overdrive", 195),
          ]

          sample_rate = 22050
          duration_sec = 36
          total_samples = sample_rate * duration_sec

          def make_wav(path, bpm, is_voices):
              beat_sec = 60.0 / bpm
              notes_hz = [220.0, 261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 493.88]
              with wave.open(path, "w") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(sample_rate)
                  frames = bytearray()
                  for i in range(total_samples):
                      t = i / float(sample_rate)
                      step = int(t / (beat_sec / 2.0))
                      if is_voices:
                          freq = notes_hz[step % len(notes_hz)] * (1.5 if (step // 8) % 2 == 1 else 1.0)
                          gate = 1.0 if (t % (beat_sec / 2.0)) < (beat_sec * 0.38) else 0.0
                          val = int(9000 * gate * math.sin(2.0 * math.pi * freq * t))
                      else:
                          bass_freq = notes_hz[(step // 2) % 4] * 0.5
                          kick = math.sin(2.0 * math.pi * 65.0 * t) * math.exp(-((t % beat_sec) * 14.0))
                          bass = math.sin(2.0 * math.pi * bass_freq * t)
                          val = int(10000 * (0.55 * bass + 0.45 * kick))
                      val = max(-32000, min(32000, val))
                      frames.extend(struct.pack("<h", val))
                  w.writeframes(bytes(frames))

          for slug, bpm in songs:
              song_dir = os.path.join("secret-exit-reimagined", "songs", slug)
              os.makedirs(song_dir, exist_ok=True)
              inst_wav = os.path.join(song_dir, "Inst.wav")
              voices_wav = os.path.join(song_dir, "Voices.wav")
              inst_ogg = os.path.join(song_dir, "Inst.ogg")
              voices_ogg = os.path.join(song_dir, "Voices.ogg")

              make_wav(inst_wav, bpm, False)
              make_wav(voices_wav, bpm, True)

              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", inst_wav, inst_ogg], check=False)
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", voices_wav, voices_ogg], check=False)

              if os.path.exists(inst_ogg) and os.path.getsize(inst_ogg) > 0:
                  os.remove(inst_wav)
              if os.path.exists(voices_ogg) and os.path.getsize(voices_ogg) > 0:
                  os.remove(voices_wav)

          with zipfile.ZipFile("Secret-Exit-Reimagined-Psych-0.7.3.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk("secret-exit-reimagined"):
                  for file in sorted(files):
                      full_path = os.path.join(root, file)
                      zf.write(full_path, full_path)

          print("Successfully built Secret-Exit-Reimagined-Psych-0.7.3.zip!")
          EOF

          if ls apk_chunks/apk_part_*.b64 1> /dev/null 2>&1; then
            echo "Reconstructing signed APK from apk_chunks..."
            cat apk_chunks/apk_part_*.b64 | tr -d '\r\n ' | base64 -di > FunkinMods-MarioMadness-V2.apk
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk FunkinMods-MarioMadness-V2.apk
          fi
          ls -lh Secret-Exit-Reimagined-Psych-0.7.3.zip FunkinMods-MarioMadness-V2.apk

      - name: Commit Psych 0.7.3 Mod ZIP & APK Directly to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Secret-Exit-Reimagined-Psych-0.7.3.zip FunkinMods-MarioMadness-V2.apk secret-exit-reimagined/
          git diff --staged --quiet || (git commit -m "chore: publish Secret-Exit-Reimagined-Psych-0.7.3.zip & APK [skip ci]" && git pull --rebase && git push)

      - name: Upload Psych 0.7.3 Mod ZIP & APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Exit-Reimagined-Psych-0.7.3-Mod-Pack
          path: |
            Secret-Exit-Reimagined-Psych-0.7.3.zip
            FunkinMods-MarioMadness-V2.apk

      - name: Publish Direct Psych 0.7.3 Mod ZIP & APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5-secret-exit-073
          name: "🍄 Mario's Madness: Secret Exit Reimagined (Psych Engine 0.7.3 Mod .ZIP)"
          body: |
            ### ⬇️ Direct Download for Actual Psych Engine 0.7.3 (PC & Android)
            1. Tap **`Secret-Exit-Reimagined-Psych-0.7.3.zip`** below under **Assets** to download the complete Psych Engine 0.7.3 mod!
            2. Extract the `secret-exit-reimagined` folder into your Psych Engine 0.7.3 `mods/` directory:
               - **PC**: `PsychEngine-0.7.3/mods/secret-exit-reimagined/`
               - **Android (Psych 0.7.3 APK)**: `/storage/emulated/0/.PsychEngine/mods/secret-exit-reimagined/`
            3. Launch **Psych Engine 0.7.3** -> **Mods** -> Enable **Mario's Madness: Secret Exit Reimagined** -> Play in **Story Mode** or **Freeplay**!
          files: |
            Secret-Exit-Reimagined-Psych-0.7.3.zip
            FunkinMods-MarioMadness-V2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
