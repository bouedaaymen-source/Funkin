name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'FunkinMods-MarioMadness-V2.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble APK from Pre-Built Chunks (Instant & Zero-Fail)
        run: |
          if ls apk_chunks/apk_part_*.b64 1> /dev/null 2>&1; then
            echo "Reconstructing signed APK from apk_chunks..."
            cat apk_chunks/apk_part_*.b64 | tr -d '\r\n ' | base64 -di > FunkinMods-MarioMadness-V2.apk
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk FunkinMods-MarioMadness-V2.apk
          fi
          ls -lh FunkinMods-MarioMadness-V2.apk

      - name: Commit APK Directly to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f FunkinMods-MarioMadness-V2.apk
          git diff --staged --quiet || (git commit -m "chore: publish FunkinMods-MarioMadness-V2.apk [skip ci]" && git push)

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FunkinMods-MarioMadness-V2-APK
          path: FunkinMods-MarioMadness-V2.apk

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-mmv2
          name: "🍄 FunkinMods — Mario's Madness V2 Edition (Android APK)"
          body: |
            ### ⬇️ Direct Android APK Download
            Tap **`FunkinMods-MarioMadness-V2.apk`** below under **Assets** to download and install the app on your Android phone (works in Algeria and worldwide).
          files: |
            FunkinMods-MarioMadness-V2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
